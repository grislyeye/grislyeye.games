name: Spelling and Grammar Check

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Check grammar and spelling
        uses: reviewdog/action-languagetool@7d3a8b5e6ca46585fc7cdbf9fee76ad359216953 # v1.24.0
        with:
          github_token: ${{ secrets.github_token }}
          language: "en-GB"
          level: "warning"
